; Momcozy D8 — CN2 panel-link sniffer on a Seeed XIAO ESP32-C3.
; See ../D8_REPAIR_SSOT.md §7b for what CN2 is and why we are listening to it.
;
;   USB flash  :  pio run -e c3 -t upload
;   OTA flash  :  OTA_PASSWORD=... pio run -e c3_ota -t upload
;   OTA by IP  :  OTA_PASSWORD=... pio run -e c3_ota_ip -t upload
;   Console    :  pio device monitor -e c3
;
; The chip on the bench: ESP32-C3 rev v0.4, QFN32, single core, 4 MB embedded
; flash (XMC), USB-Serial/JTAG.

[platformio]
default_envs = c3

[env:c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

; The XIAO C3 talks over the C3's *native* USB-Serial/JTAG, not a UART bridge,
; so the console is USB-CDC and UART0's pins stay free for us to steal for the
; sniffer. This is the opposite of ../flowtest/ (ESP32-S3 behind a CH343), which
; is why that project sets CDC_ON_BOOT=0 and this one sets 1.
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; min_spiffs gives app0/app1 ≈ 1.9 MB each instead of default.csv's 1.25 MB.
; WiFi + WebServer + ArduinoOTA lands near 1 MB, and running out of app-slot
; headroom is a miserable way to discover you can no longer OTA.
board_build.partitions = min_spiffs.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

; --- Same firmware over WiFi -------------------------------------------------
; Reached by mDNS, not IP: the DHCP lease is not ours to depend on.
;
; --host_port is pinned deliberately. espota tells the ESP to connect BACK to
; this machine, and by default picks a random high port each run. The workstation
; and the IoT network are different subnets here, and that reverse connection is
; exactly what gets dropped — which shows up as "No response from device"
; immediately after a *successful* auth. A fixed port is at least diagnosable,
; and can be allowed through the firewall explicitly.
;
; A failed or interrupted upload is safe: the image goes to the inactive slot and
; the boot partition only switches after it verifies. The running firmware is
; untouched.
[env:c3_ota]
extends = env:c3
upload_protocol = espota
upload_port = baby-washer.local
upload_flags =
    --port=3232
    --host_port=45123
    --auth=${sysenv.OTA_PASSWORD}

; Fallback for when mDNS is not crossing the subnet boundary. Set WASHER_IP.
[env:c3_ota_ip]
extends = env:c3
upload_protocol = espota
upload_port = ${sysenv.WASHER_IP}
upload_flags =
    --port=3232
    --host_port=45123
    --auth=${sysenv.OTA_PASSWORD}

; --- Host-side unit tests ------------------------------------------------------
; The pure frame logic lives in lib/cn2core/cn2core.h with no Arduino
; dependency, so it compiles and runs natively. cn2.cpp calls into the same
; header, which is what stops these tests drifting into a parallel copy.
;
;   pio test -e native
;   ./tools/coverage.sh          tests + line coverage
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I lib/cn2core
    --coverage
    -O0
    -g
; --coverage has to reach the linker too, and PlatformIO does not forward
; build_flags to LINKFLAGS on the native platform.
extra_scripts = pre:tools/native_coverage.py
build_src_filter = -<*>
