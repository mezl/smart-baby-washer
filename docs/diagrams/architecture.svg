<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="System architecture: ESP32-C3 sits between the D8 main board and its front panel on the CN2 UART link, and bridges to Home Assistant over WiFi.">
<style>
  .bg{fill:#fbfbfd}
  .card{fill:#ffffff;stroke:#c9d1d9;stroke-width:2;rx:10}
  .oem{fill:#eef4fb;stroke:#1b6ec2}
  .ours{fill:#eafaf1;stroke:#2f9e63}
  .ha{fill:#fff6e8;stroke:#d98324}
  .t{font:600 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#111}
  .s{font:12.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#444}
  .tiny{font:11.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#666}
  .lbl{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1b6ec2}
  .safe{font:600 12.5px system-ui,sans-serif;fill:#2f9e63}
  .wire{stroke:#1b6ec2;stroke-width:2.5;fill:none}
  .wifi{stroke:#d98324;stroke-width:2.5;fill:none;stroke-dasharray:7 5}
  .title{font:700 17px system-ui,sans-serif;fill:#111}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .card{fill:#161b22;stroke:#30363d}
    .oem{fill:#12233a;stroke:#4493f8}
    .ours{fill:#0f2a1c;stroke:#3fb950}
    .ha{fill:#2b1d0e;stroke:#e3a008}
    .t,.title{fill:#e6edf3} .s{fill:#b1bac4} .tiny{fill:#8b949e}
    .lbl{fill:#4493f8} .safe{fill:#3fb950} .wire{stroke:#4493f8} .wifi{stroke:#e3a008}
  }
</style>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#1b6ec2"/></marker>
  <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#d98324"/></marker>
</defs>

<rect class="bg" width="920" height="520"/>
<text class="title" x="30" y="34">Where the ESP32 sits — and what it deliberately does not touch</text>
<text class="tiny" x="30" y="54">It speaks the panel's language. That is a load-control interface, NOT a protected request channel &#8212; see safety.md.</text>

<!-- main board -->
<rect class="card oem" x="30" y="90" width="230" height="235" rx="10"/>
<text class="t" x="48" y="118">D8 MAIN BOARD</text>
<text class="s" x="48" y="140">BBW04001-UL-P</text>
<text class="s" x="48" y="158">MCU: FMD BF7612 (8051)</text>
<line x1="48" y1="176" x2="242" y2="176" stroke="#c9d1d9"/>
<text class="safe" x="48" y="198">EXECUTES, BARELY VETOES:</text>
<text class="s" x="48" y="219">• gates the intake motor</text>
<text class="s" x="48" y="238">• on its own RUN flag</text>
<text class="s" x="48" y="257">• reports lid, RUN, E5</text>
<text class="s" x="48" y="276">• drives the relays</text>
<text class="s" x="48" y="295">• no fill timeout</text>
<text class="tiny" x="48" y="316">mains side — untouched</text>

<!-- esp32 -->
<rect class="card ours" x="345" y="115" width="230" height="185" rx="10"/>
<text class="t" x="363" y="143">ESP32-C3  (XIAO)</text>
<text class="s" x="363" y="165">transparent UART relay</text>
<line x1="363" y1="182" x2="557" y2="182" stroke="#c9d1d9"/>
<text class="s" x="363" y="204">• forwards every byte</text>
<text class="s" x="363" y="223">• logs both directions</text>
<text class="s" x="363" y="242">• injects commands</text>
<text class="s" x="363" y="261">• web UI + OTA</text>
<text class="tiny" x="363" y="284">3.3 V logic — see wiring</text>

<!-- panel -->
<rect class="card oem" x="660" y="115" width="230" height="185" rx="10"/>
<text class="t" x="678" y="143">FRONT PANEL</text>
<text class="s" x="678" y="165">own MCU, buttons, display</text>
<line x1="678" y1="182" x2="872" y2="182" stroke="#c9d1d9"/>
<text class="s" x="678" y="204">keeps working normally</text>
<text class="s" x="678" y="223">in RELAY mode — the</text>
<text class="s" x="678" y="242">machine behaves exactly</text>
<text class="s" x="678" y="261">as it did before</text>

<!-- links -->
<path class="wire" marker-end="url(#a)" d="M260,180 L340,180"/>
<path class="wire" marker-end="url(#a)" d="M340,235 L262,235"/>
<text class="lbl" x="266" y="172">CN2 pin 1</text>
<text class="lbl" x="266" y="256">CN2 pin 2</text>

<path class="wire" marker-end="url(#a)" d="M580,180 L655,180"/>
<path class="wire" marker-end="url(#a)" d="M655,235 L582,235"/>
<text class="lbl" x="600" y="170">B&#8594;P</text>
<text class="lbl" x="600" y="256">P&#8594;B</text>

<!-- HA -->
<rect class="card ha" x="345" y="400" width="230" height="80" rx="10"/>
<text class="t" x="363" y="428">Home Assistant</text>
<text class="s" x="363" y="450">ESPHome / MQTT</text>
<text class="tiny" x="363" y="469">start, stop, status, alerts</text>
<path class="wifi" marker-end="url(#ao)" d="M460,305 L460,395"/>
<text class="lbl" x="472" y="355" fill="#d98324">WiFi + OTA</text>

<text class="tiny" x="30" y="500">Blue = original equipment, unmodified.  Green = added.  &#9888; The heater bits fire with no cycle, no water and the lid open.</text>
</svg>
